name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一个分支只保留最新一次运行，省掉排队的构建。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（Go）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 格式检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件没有 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试
        run: go test ./... -race -count=1

      - name: 编译
        run: go build ./cmd/server

  web:
    name: 前端（Next.js）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        # 页面全是动态渲染，构建时不需要后端在跑。
        run: npm run build

  e2e:
    name: 端到端（Playwright）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium
        # e2e 只跑 chromium；--with-deps 装上系统库（CI 镜像里没有）。
        run: npx playwright install --with-deps chromium

      - name: 运行 e2e
        # 假后端 + next dev 都由 playwright.config.ts 的 webServer 拉起，
        # 不需要 Postgres 或 Go 进程。
        run: npm run test:e2e

      - name: 失败时保存报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  docker:
    name: 镜像构建（Docker）
    # 上面三个 job 只验证源码；这个 job 验证 Dockerfile 本身能构建，
    # 这样 dependabot 提基础镜像升级（Go / Node / Postgres）时 CI 才有意义。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: 构建生产镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # 需要 load 到本地，下一步才能在镜像里跑 node 冒烟。
          load: true
          tags: beichuang:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟：镜像里的 node 能启动
        # 踩过的坑：node 二进制是从 node:alpine 拷进 postgres:alpine 的，
        # 新版本 node 多了 libatomic 依赖，缺了运行时才炸，而 build 阶段看起来一切正常。
        run: docker run --rm beichuang:ci node -v
